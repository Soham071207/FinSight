name: AMFI Mutual Fund Auto-Sync

on:
  schedule:
    # Runs at 00:30 UTC (6:00 AM IST) and 12:30 UTC (6:00 PM IST)
    - cron: '30 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  sync_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_mutual.txt

      - name: Run Sync Engine
        run: python sync_engine.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add master_funds_database.csv last_sync.txt
          # Only commit if there are actual changes
          git diff --staged --quiet || (git commit -m "Automated AMFI data sync" && git push)
