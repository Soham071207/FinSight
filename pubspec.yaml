name: finsight
description: A production-grade, standalone cross-platform finance app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management & Navigation ─────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0

  # ── Networking & Persistence ───────────────────────────────────
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Charts & Visualisation ─────────────────────────────────────
  syncfusion_flutter_charts: ^26.2.14   # stable; free < $1M revenue
  fl_chart: ^0.68.0                     # donut / pie charts
  percent_indicator: ^4.2.3             # CIBIL gauge fill bar

  # ── Design & UI Utilities ──────────────────────────────────────
  google_fonts: ^6.2.1
  shimmer: ^3.0.0                       # skeleton loaders
  flutter_animate: ^4.5.0              # micro-animations
  lottie: ^3.1.2                        # Lottie JSON animations

  # ── Utilities ──────────────────────────────────────────────────
  intl: ^0.19.0                         # ₹ formatting, dates
  uuid: ^4.4.0                          # unique expense entry IDs
  permission_handler: ^11.3.0           # Runtime permission handling
  telephony: ^0.2.0                     # Real-time SMS listener

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    # Bundled fund data snapshot (Module 2 — Mutual Fund List)
    - assets/data/funds_snapshot.json
    # Lottie animation files (splash, loading states)
    - assets/lottie/

  # Google Fonts are fetched at runtime via the google_fonts package.
  # No manual font file declarations are needed.
